name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fullstack-osa11.onrender.com/|https://fullstack-osa11.onrender.com/health
          max-attempts: 3
          retry-delay: 90s
